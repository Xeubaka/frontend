<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Chess Platform</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="landing">
    <h1>♟ Chess Platform</h1>
    <p>Learning-project multiplayer chess. Create a room and send the code to a friend.</p>

    <section class="card">
      <h2>Create a room</h2>
      <input id="createName" placeholder="Your name" />
      <select id="createTimeControl">
        <option value="1">1 min</option>
        <option value="3" selected>3 min</option>
        <option value="5">5 min</option>
        <option value="10">10 min</option>
        <option value="15">15 min</option>
        <option value="30">30 min</option>
      </select>
      <button id="createBtn">Create room</button>
      <p id="createResult"></p>
    </section>

    <section class="card">
      <h2>Join a room</h2>
      <input id="joinCode" placeholder="Room code" />
      <input id="joinName" placeholder="Your name" />
      <button id="joinBtn">Join room</button>
      <p id="joinError" class="error"></p>
    </section>

    <section class="card">
      <h2>Play vs. Bot</h2>
      <input id="botName" placeholder="Your name" />
      <select id="botColor">
        <option value="white">Play as White</option>
        <option value="black">Play as Black</option>
      </select>
      <select id="botDifficulty">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
      <button id="playBotBtn">Play vs. Bot</button>
    </section>

    <p><a href="admin.html">Admin: game history</a></p>
  </main>
  <script src="js/lobby.js"></script>
</body>
</html>
