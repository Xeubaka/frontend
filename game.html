<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Chess Platform — Room</title>
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<!-- chess.js ships ESM-only from cdnjs for every version (no browser-global
     UMD build exists any more), so it's imported as a module inside
     js/game.js instead of exposed as a window global here. -->

</head>
<body>
  <main class="game-layout">
    <section class="board-panel">
      <h2 id="roomTitle">Room</h2>
      <p id="status"></p>
      <button id="resignBtn" type="button" class="resign-btn hidden">Resign</button>
      <p>Win probability</p>
      <div class="prob-bar">
        <div id="whiteProb" class="prob-white">50%</div>
        <div id="blackProb" class="prob-black">50%</div>
      </div>
      <div id="board" class="board"></div>
      <p id="moveError" class="error"></p>
    </section>

    <div id="promotionModal" class="modal hidden">
      <div class="modal-content">
        <p>Promote pawn to:</p>
        <div class="promotion-choices">
          <button type="button" data-piece="q"></button>
          <button type="button" data-piece="r"></button>
          <button type="button" data-piece="b"></button>
          <button type="button" data-piece="n"></button>
        </div>
      </div>
    </div>

    <aside class="side-panel">
      <div class="panel-block">
        <h3>Move log</h3>
        <ol id="moveLog"></ol>
      </div>
      <div class="panel-block chat-block">
        <h3>Chat</h3>
        <div id="chatMessages" class="chat-messages"></div>
        <div class="chat-input-row">
          <input id="chatInput" placeholder="Say something..." />
          <button id="chatSend">Send</button>
        </div>
      </div>
    </aside>
  </main>
  <script type="module" src="js/game.js"></script>
</body>
</html>
